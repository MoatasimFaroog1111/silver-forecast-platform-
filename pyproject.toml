[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-forecast-platform"
version = "1.0.0"
description = "End-to-end silver USD/KG forecasting platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pandas==2.2.3",
  "numpy==2.3.5",
  "joblib==1.5.3",
  "scikit-learn==1.8.0",
  "catboost==1.2.8",
  "SQLAlchemy==2.0.50",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

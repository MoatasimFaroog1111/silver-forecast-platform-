name: Materialize Silver Forecast Platform

on:
  push:
    branches: [main]
    paths:
      - "bootstrap_bundle_v3/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap_bundle_v3/part_*.txt > /tmp/silver-platform.tar.gz.b64
          echo "5e30f369f45a2474276c67ec876631f37b866c3a0e0982429faafa528df719fa  /tmp/silver-platform.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/silver-platform.tar.gz.b64 > /tmp/silver-platform.tar.gz
          echo "cccfe65fd9e6568ff0f46cd7b0140dd04d4a3addcf3ee27d685a2bfd66bd224d  /tmp/silver-platform.tar.gz" | sha256sum -c -
          mkdir -p /tmp/silver-platform
          tar -xzf /tmp/silver-platform.tar.gz -C /tmp/silver-platform

      - name: Rebuild exact persisted models once
        shell: bash
        working-directory: /tmp/silver-platform
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m silver_forecast.model_registry.rebuild_persisted_forecast_models
          test "$(find persisted_forecast_models -name '*D__CatBoost_Return.joblib' | wc -l)" -eq 6

      - name: Replace bootstrap tree with verified product
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/silver-platform/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete Silver Forecast Platform"
          git push origin HEAD:main
